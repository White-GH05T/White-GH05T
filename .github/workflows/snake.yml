# Save as .github/workflows/snake.yml in the White-GH05T/White-GH05T repo.
# Generates the animated contribution snake shown in the README,
# publishing the SVGs to an "output" branch.
name: Generate contribution snake

on:
  schedule:
    - cron: "23 0 * * *"   # daily
  workflow_dispatch:        # run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ec4899&color_dots=#ebedf0,#67e8f9,#818cf8,#c084fc,#f472b6
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#f59e0b&color_dots=#161b22,#0e7490,#4f46e5,#9333ea,#db2777

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
