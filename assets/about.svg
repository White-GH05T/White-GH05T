<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" font-family="'Segoe UI', Inter, -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif">
<defs>
  <clipPath id="outer"><rect width="1200" height="360" rx="28"/></clipPath>
  <clipPath id="glassClip"><rect x="24" y="24" width="690" height="312" rx="24"/><rect x="726" y="24" width="450" height="312" rx="24"/></clipPath>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="55"/></filter>
  <filter id="frost" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="95"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.16"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/></linearGradient>
  <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/><stop offset="1" stop-color="#ffffff" stop-opacity="0"/></linearGradient>
  <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/><stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/><stop offset="1" stop-color="#ffffff" stop-opacity="0.35"/></linearGradient>
  <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.5" stop-color="#818cf8"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
  <linearGradient id="nameFill" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#c7d2fe"/></linearGradient>
</defs>
<g clip-path="url(#outer)">
  <rect width="1200" height="360" fill="#050816"/>
  <g filter="url(#soft)"><circle cx="864" cy="72" r="336" fill="#0e7490" opacity="0.55"><animate attributeName="cx" values="864;936;792;864" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="72;29;115;72" dur="18s" repeatCount="indefinite"/></circle><circle cx="1140" cy="270" r="264" fill="#1e3a8a" opacity="0.55"><animate attributeName="cx" values="1140;1212;1068;1140" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="270;227;313;270" dur="21s" repeatCount="indefinite"/></circle><circle cx="300" cy="342" r="336" fill="#3730a3" opacity="0.55"><animate attributeName="cx" values="300;372;228;300" dur="20s" repeatCount="indefinite"/><animate attributeName="cy" values="342;299;385;342" dur="24s" repeatCount="indefinite"/></circle><circle cx="144" cy="90" r="264" fill="#1d4ed8" opacity="0.55"><animate attributeName="cx" values="144;216;72;144" dur="23s" repeatCount="indefinite"/><animate attributeName="cy" values="90;47;133;90" dur="27s" repeatCount="indefinite"/></circle></g>
  <g clip-path="url(#glassClip)"><g filter="url(#frost)"><circle cx="864" cy="72" r="336" fill="#0e7490" opacity="0.55"><animate attributeName="cx" values="864;936;792;864" dur="14s" repeatCount="indefinite"/><animate attributeName="cy" values="72;29;115;72" dur="18s" repeatCount="indefinite"/></circle><circle cx="1140" cy="270" r="264" fill="#1e3a8a" opacity="0.55"><animate attributeName="cx" values="1140;1212;1068;1140" dur="17s" repeatCount="indefinite"/><animate attributeName="cy" values="270;227;313;270" dur="21s" repeatCount="indefinite"/></circle><circle cx="300" cy="342" r="336" fill="#3730a3" opacity="0.55"><animate attributeName="cx" values="300;372;228;300" dur="20s" repeatCount="indefinite"/><animate attributeName="cy" values="342;299;385;342" dur="24s" repeatCount="indefinite"/></circle><circle cx="144" cy="90" r="264" fill="#1d4ed8" opacity="0.55"><animate attributeName="cx" values="144;216;72;144" dur="23s" repeatCount="indefinite"/><animate attributeName="cy" values="90;47;133;90" dur="27s" repeatCount="indefinite"/></circle></g><rect width="1200" height="360" fill="#ffffff" opacity="0.035"/></g>
  <rect x="24" y="24" width="690" height="312" rx="24" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.4"/><rect x="25" y="25" width="688" height="90" rx="23" fill="url(#gloss)"/><rect x="726" y="24" width="450" height="312" rx="24" fill="url(#sheen)" stroke="url(#edge)" stroke-width="1.4"/><rect x="727" y="25" width="448" height="90" rx="23" fill="url(#gloss)"/>
  <text x="56" y="76" font-size="26" font-weight="800" fill="#ffffff" fill-opacity="1" text-anchor="start" >Hi, I&#x27;m Abdul 👋</text><text x="56" y="116" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >I build responsive, high-clarity web and mobile experiences</text><text x="56" y="142" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >with React, Angular, Flutter, Laravel and modern backend tooling.</text><text x="56" y="168" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >My work sits where product UX, engineering reliability and</text><text x="56" y="194" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >fast delivery meet.</text><text x="56" y="220" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" ></text><text x="56" y="246" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >I care about interfaces that feel fast, intentional and</text><text x="56" y="272" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >trustworthy, not just functional. My background spans frontend</text><text x="56" y="298" font-size="16.5" font-weight="400" fill="#e2e8f0" fill-opacity="0.88" text-anchor="start" >architecture, APIs, databases, UI design and AR/VR in Unity.</text><text x="752" y="76" font-size="22" font-weight="800" fill="#ffffff" fill-opacity="1" text-anchor="start" >Quick Facts</text><circle cx="760" cy="107" r="4" fill="#22d3ee"/><text x="774" y="112" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Role</text><text x="880" y="112" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >Frontend / Full Stack Developer</text><circle cx="760" cy="141" r="4" fill="#818cf8"/><text x="774" y="146" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Company</text><text x="880" y="146" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >Housekeeping Co · Dubai</text><circle cx="760" cy="175" r="4" fill="#a78bfa"/><text x="774" y="180" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Frontend</text><text x="880" y="180" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >React · Angular · Next.js</text><circle cx="760" cy="209" r="4" fill="#38bdf8"/><text x="774" y="214" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Mobile</text><text x="880" y="214" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >Flutter · Dart</text><circle cx="760" cy="243" r="4" fill="#2dd4bf"/><text x="774" y="248" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Backend</text><text x="880" y="248" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >Laravel · NestJS · Node.js</text><circle cx="760" cy="277" r="4" fill="#34d399"/><text x="774" y="282" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Edge</text><text x="880" y="282" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >AI-augmented delivery</text><circle cx="760" cy="311" r="4" fill="#22d3ee"/><text x="774" y="316" font-size="14" font-weight="700" fill="#ffffff" fill-opacity="0.65" text-anchor="start" >Beyond code</text><text x="880" y="316" font-size="15" font-weight="600" fill="#ffffff" fill-opacity="0.95" text-anchor="start" >Martial arts · Photography · Comics</text>
</g>
<rect x="0.7" y="0.7" width="1198.6" height="358.6" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.10"/>
